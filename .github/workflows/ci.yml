name: L2 contracts ci

# THROWAWAY: probe for nondeterministic L2 zkBytecodeHash values across runners (PR #56). Do not merge.
on:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  zk-hash-probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./l2-contracts
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 1

      - name: Install zksync-foundry
        uses: ./.github/actions/install-zksync-foundry

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: forge install && npm install

      - name: Diagnostics (pre-build)
        run: |
          P="${GITHUB_WORKSPACE}/probe"; mkdir -p "$P"
          { echo "image: ${ImageOS} ${ImageVersion}"; uname -a; nproc; lscpu; df -T .; } > "$P/env.txt" 2>&1
          forge remappings > "$P/remappings.txt" 2>&1
          forge config --json > "$P/config.json" 2>&1 || true
          { echo "== lib"; ls -f lib; for d in lib/*/lib lib/*/lib/*/lib; do echo "== $d"; ls -f "$d"; done; echo "== node_modules/@openzeppelin"; ls -f node_modules/@openzeppelin; } > "$P/readdir.txt" 2>&1
          { ls -la ~/.zksync; } > "$P/zksync-pre.txt" 2>&1
          echo "image: ${ImageOS} ${ImageVersion}"; sha256sum "$P/remappings.txt"; cat "$P/remappings.txt"

      - name: Build (zkSync) with build-info
        run: forge build --zksync --build-info

      - name: Diagnostics (post-build)
        run: |
          P="${GITHUB_WORKSPACE}/probe"
          { ls -la ~/.zksync; sha256sum ~/.zksync/*; for b in ~/.zksync/*; do echo "== $b"; "$b" --version 2>&1 | head -3; done; } > "$P/zksync-post.txt" 2>&1
          cat "$P/zksync-post.txt"
          mkdir -p "$P/artifacts"
          cp zkout/Address.sol/Address.json zkout/ZkTokenGovernor.sol/ZkTokenGovernor.json "$P/artifacts/"
          python3 - "$P" <<'EOF'
          import json, glob, os, sys
          P = sys.argv[1]
          sets = {"01000b17af2b": "A (matches on-chain)", "01000b179566": "B (e589fd9)"}
          tok = json.load(open("zkout/ZkTokenGovernor.sol/ZkTokenGovernor.json"))["hash"]
          addr = json.load(open("zkout/Address.sol/Address.json"))["hash"]
          verdict = sets.get(tok[:12], "UNKNOWN")
          print(f"ZkTokenGovernor={tok}\nAddress={addr}\nSET={verdict}")
          open(os.path.join(P, "result.txt"), "w").write(f"image={os.environ.get('ImageVersion')}\nZkTokenGovernor={tok}\nAddress={addr}\nSET={verdict}\n")
          summary = {}
          for f in glob.glob("zkout/build-info/*.json"):
              d = json.load(open(f))
              inp = d.get("input", {})
              s = dict(inp.get("settings", {}))
              s.pop("outputSelection", None)
              summary[os.path.basename(f)] = {
                  "top": {k: v for k, v in d.items() if k not in ("input", "output", "source_id_to_path")},
                  "settings": s,
                  "n_sources": len(inp.get("sources", {})),
              }
          json.dump(summary, open(os.path.join(P, "build-info-summary.json"), "w"), indent=1, sort_keys=True)
          EOF
          cp -r zkout/build-info "$P/build-info"

      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.n }}
          path: probe/

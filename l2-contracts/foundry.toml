[profile.default]
  evm_version = "paris"
  fs_permissions = [{ access = "read", path = "./zkout" }]
  fuzz = { runs = 50 }
  optimizer = true
  optimizer_runs = 10_000_000
  remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "@murky/=lib/murky/",
    # council-governance is built on OpenZeppelin v5 and imports its own sources via `src/...`. These scoped
    # remappings apply only to files under lib/council-governance/, so existing contracts keep resolving OZ v4 and our
    # own `src/`. Foundry ignores a remapping named exactly `src/`, so upstream's `src/...` imports are remapped by the
    # narrower prefixes they actually use.
    "lib/council-governance/:@openzeppelin/contracts/=lib/openzeppelin-contracts-v5/contracts/",
    "lib/council-governance/:src/extensions/=lib/council-governance/src/extensions/",
    "lib/council-governance/:src/BasicCouncilVetoGovernor.sol=lib/council-governance/src/BasicCouncilVetoGovernor.sol",
    # Our own OZ v5 based contracts import OZ v5 and council-governance through these aliases.
    "@openzeppelin/contracts-v5/=lib/openzeppelin-contracts-v5/contracts/",
    "council-governance/=lib/council-governance/src/",
  ]
  # No global solc_version: existing contracts pin `0.8.24` via exact pragmas, council-governance pins `0.8.30`.
  # Files with floating pragmas are pinned to 0.8.24 below so their bytecode stays unchanged.
  # OpenZeppelin v5.4 requires Cancun (`mcopy`), so the OZ v5 tree and everything built on it compiles with the
  # `cancun` profile while existing contracts stay on `paris`.
  additional_compiler_profiles = [{ name = "cancun", evm_version = "cancun" }]
  compilation_restrictions = [
    { paths = "lib/openzeppelin-contracts-v5/**", min_evm_version = "cancun" },
    { paths = "lib/council-governance/src/**", min_evm_version = "cancun" },
    { paths = "src/council/**", min_evm_version = "cancun" },
    { paths = "src/lib/L2ContractHelper.sol", version = "=0.8.24" },
    { paths = "test/fakes/TimelockControllerFake.sol", version = "=0.8.24" },
    { paths = "test/helpers/ProposalBuilder.sol", version = "=0.8.24" },
  ]
  verbosity = 3

[profile.ci]
  fuzz = { runs = 2500 }
  invariant = { runs = 1000 }

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  # Speed up compilation and tests during development.
  optimizer = false

[fmt]
  bracket_spacing = false
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 2
  wrap_comments = true

[rpc_endpoints]
  zksync = "${ZKSYNC_RPC_URL}"

[profile.default]
  evm_version = "paris"
  fs_permissions = [{ access = "read", path = "./zkout" }]
  fuzz = { runs = 50 }
  optimizer = true
  optimizer_runs = 10_000_000
  remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "@murky/=lib/murky/",
  ]
  solc_version = "0.8.24"
  verbosity = 3

[profile.ci]
  fuzz = { runs = 2500 }
  invariant = { runs = 1000 }

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  # Speed up compilation and tests during development.
  optimizer = false

[fmt]
  bracket_spacing = false
  # The deployed sources that the current forge fmt would reformat, which would change their verified source. The other
  # deployed sources are already formatted as forge fmt formats them. `.scopelint` separately lists the deployed sources
  # that break a naming rule.
  ignore = [
    "src/ZkGovOpsGovernor.sol",
    "src/ZkMerkleDistributor.sol",
    "src/ZkProtocolGovernor.sol",
    "src/ZkTokenGovernor.sol",
    "src/ZkTokenV1.sol",
    "src/lib/GovernorCountingFractional.sol",
    "src/lib/Nonces.sol",
  ]
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 2
  wrap_comments = true

[rpc_endpoints]
  zksync = "${ZKSYNC_RPC_URL}"

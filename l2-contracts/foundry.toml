[profile.default]
  evm_version = "cancun"
  fs_permissions = [{ access = "read", path = "./zkout" }]
  fuzz = { runs = 50 }
  optimizer = true
  optimizer_runs = 10_000_000
  remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "@murky/=lib/murky/",
    # Unused by our sources, but auto-detection resolves these two from equally deep candidates in readdir order,
    # which differs between CI runner images. Remappings are part of the solc metadata hashed into every zk
    # bytecode, so leaving them to chance flips every L2 zkBytecodeHash. Pinned to the deployed set.
    "erc4626-tests/=lib/openzeppelin-contracts-upgradeable/lib/erc4626-tests/",
    "openzeppelin/=lib/openzeppelin-contracts-upgradeable/contracts/",
  ]
  solc_version = "0.8.24"
  verbosity = 3

[profile.ci]
  fuzz = { runs = 2500 }
  invariant = { runs = 1000 }

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  # Speed up compilation and tests during development.
  optimizer = false

[fmt]
  bracket_spacing = false
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 2
  wrap_comments = true

[rpc_endpoints]
  zksync = "${ZKSYNC_RPC_URL}"

# The newest zksolc the Era explorer verifies; the governors redeployed for the Guardians removal are built with it.
[profile.default.zksync]
  zksolc = "1.5.17"
